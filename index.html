<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COMMUNITEA</title>
<link rel="icon" type="image/png" href="COMMUNITEA_LOGO.png">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f7f9;
    color: #14171a;
}

.app {
    width: 100%;
    max-width: 700px;
    margin: auto;
    background: white;
    min-height: 100vh;
    border-left: 1px solid #ddd;
    border-right: 1px solid #ddd;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #ddd;
    padding: 16px 20px;
}

.header h2 {
    margin: 0;
    font-size: 20px;
}

/* =========================
   STATUS
========================= */

.status {
    padding: 8px 20px;
    font-size: 12px;
    color: #777;
    border-bottom: 1px solid #eee;
}

.status.online {
    color: #159447;
}

.status.error {
    color: #d62828;
}

/* =========================
   USERNAME
========================= */

.username-box {
    padding: 15px 20px;
    background: #f8f9fa;
    border-bottom: 1px solid #ddd;
}

.username-box label {
    font-size: 13px;
    font-weight: bold;
    display: block;
    margin-bottom: 6px;
}

.username-row {
    display: flex;
    gap: 8px;
}

.username-row input {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

.username-row input:focus {
    border-color: #111;
}

.username-row button {
    border: none;
    background: #111;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.current-user {
    margin-top: 8px;
    font-size: 13px;
    color: #555;
}

/* =========================
   COMPOSER
========================= */

.composer {
    padding: 18px 20px;
    border-bottom: 1px solid #ddd;
}

textarea {
    width: 100%;
    min-height: 80px;
    resize: vertical;
    border: none;
    outline: none;
    font-size: 16px;
    font-family: inherit;
}

.composer-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
}

.photo-label {
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
}

input[type="file"] {
    display: none;
}

.post-button {
    background: #111;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 9px 20px;
    cursor: pointer;
    font-weight: bold;
}

.post-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.photo-preview {
    display: none;
    margin-top: 10px;
}

.photo-preview img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 12px;
    display: block;
}

.remove-photo {
    margin-top: 6px;
    border: none;
    background: #eee;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
}

/* =========================
   POSTS
========================= */

.post {
    padding: 18px 20px;
    border-bottom: 1px solid #ddd;
}

.post-header {
    display: flex;
    gap: 10px;
    align-items: center;
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #111;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    flex-shrink: 0;
}

.name {
    font-weight: bold;
}

.username {
    color: #657786;
    margin-left: 5px;
}

.post-time {
    color: #657786;
    font-size: 12px;
    margin-left: 5px;
}

.post-text {
    margin-top: 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.45;
}

.post-image {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    margin-top: 12px;
    border-radius: 12px;
    background: #f5f5f5;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;
    justify-content: space-between;
    max-width: 500px;
    margin-top: 15px;
}

.action-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #657786;
    font-size: 14px;
    padding: 6px;
}

.action-btn:hover {
    color: #111;
}

.liked {
    color: #e0245e;
}

.reposted {
    color: #17bf63;
}

/* =========================
   COMMENTS
========================= */

.comments {
    display: none;
    margin-top: 15px;
    border-top: 1px solid #eee;
    padding-top: 12px;
}

.comment {
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}

.comment-header {
    display: flex;
    gap: 8px;
    align-items: center;
}

.comment-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #555;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
}

.comment-text {
    margin: 5px 0 0 38px;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.comment-image {
    max-width: 80%;
    max-height: 250px;
    margin: 8px 0 0 38px;
    border-radius: 10px;
}

.comment-form {
    margin-top: 12px;
}

.comment-form textarea {
    min-height: 50px;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    font-size: 14px;
}

.comment-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
}

.reply-button {
    border: none;
    background: #111;
    color: white;
    padding: 7px 13px;
    border-radius: 15px;
    cursor: pointer;
}

.delete-button {
    background: none;
    border: none;
    color: #e0245e;
    cursor: pointer;
    font-size: 12px;
    margin-left: auto;
}

.empty {
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;
    padding: 40px;
    color: #777;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .app {
        border: none;
    }

    .post,
    .composer,
    .header,
    .username-box,
    .status {
        padding-left: 15px;
        padding-right: 15px;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">
        <h2>Home</h2>
    </div>

    <!-- CONNECTION STATUS -->

    <div
        id="status"
        class="status"
    >
        Connecting...
    </div>

    <!-- USERNAME -->

    <div class="username-box">

        <label>Your Username</label>

        <div class="username-row">

            <input
                type="text"
                id="usernameInput"
                placeholder="Enter your username"
                maxlength="30"
            >

            <button onclick="setUsername()">
                Save
            </button>

        </div>

        <div
            class="current-user"
            id="currentUser"
        >
            Not set
        </div>

    </div>

    <!-- CREATE POST -->

    <div class="composer">

        <textarea
            id="postInput"
            placeholder="What's happening?"
            maxlength="500"
        ></textarea>

        <div
            class="photo-preview"
            id="postPhotoPreview"
        >

            <img
                id="postPreviewImage"
                alt="Preview"
            >

            <button
                class="remove-photo"
                onclick="removePostPhoto()"
            >
                Remove photo
            </button>

        </div>

        <div class="composer-bottom">

            <label class="photo-label">

                📷 Add Photo

                <input
                    type="file"
                    id="postPhoto"
                    accept="image/*"
                    onchange="previewPostPhoto()"
                >

            </label>

            <button
                class="post-button"
                id="postButton"
                onclick="createPost()"
            >
                Post
            </button>

        </div>

    </div>

    <!-- FEED -->

    <div id="feed">

        <div class="loading">
            Loading posts...
        </div>

    </div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    onValue,
    update,
    remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

import {
    getStorage,
    ref as storageRef,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";


/* =====================================================
   🔥 YOUR FIREBASE CONFIGURATION
   REPLACE THESE VALUES WITH YOUR OWN
===================================================== */

//
const firebaseConfig = {
  apiKey: "AIzaSyC2ubY7OMljthdGXd-u5y_sqG5vuY_HufQ",
  authDomain: "communitea-eb2b8.firebaseapp.com",
  databaseURL: "https://communitea-eb2b8-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "communitea-eb2b8",
  storageBucket: "communitea-eb2b8.firebasestorage.app",
  messagingSenderId: "478656370103",
  appId: "1:478656370103:web:c4ba49f31494dd6ded8432",
  measurementId: "G-49K3EMD836"
};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const database =
    getDatabase(app);

const storage =
    getStorage(app);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentUsername =
    localStorage.getItem(
        "404_currentUsername"
    ) || "";

let selectedPostFile = null;

let selectedReplyFiles = {};

let posts = {};


/* =====================================================
   ELEMENTS
===================================================== */

const feed =
    document.getElementById("feed");

const status =
    document.getElementById("status");

const usernameInput =
    document.getElementById("usernameInput");

const currentUser =
    document.getElementById("currentUser");

const postButton =
    document.getElementById("postButton");


/* =====================================================
   USERNAME
===================================================== */

function updateUsernameDisplay() {

    if (currentUsername) {

        currentUser.innerHTML =
            `Logged in as <strong>@${escapeHTML(currentUsername)}</strong>`;

        usernameInput.value =
            currentUsername;

    } else {

        currentUser.textContent =
            "Not set";

    }

}


window.setUsername = function() {

    const username =
        usernameInput.value.trim();

    if (!username) {

        alert(
            "Please enter a username."
        );

        return;

    }

    currentUsername =
        username;

    localStorage.setItem(
        "404_currentUsername",
        username
    );

    updateUsernameDisplay();

};


/* =====================================================
   FIREBASE CONNECTION
===================================================== */

const connectedRef =
    ref(database, ".info/connected");

onValue(
    connectedRef,
    (snapshot) => {

        if (snapshot.val() === true) {

            status.textContent =
                "● Connected — live feed";

            status.className =
                "status online";

        } else {

            status.textContent =
                "● Offline";

            status.className =
                "status error";

        }

    }
);


/* =====================================================
   REAL-TIME FEED
===================================================== */

const postsRef =
    ref(database, "posts");

onValue(
    postsRef,
    (snapshot) => {

        posts =
            snapshot.val() || {};

        renderPosts();

    },
    (error) => {

        console.error(error);

        status.textContent =
            "Database error";

        status.className =
            "status error";

    }
);


/* =====================================================
   POST PHOTO PREVIEW
===================================================== */

window.previewPostPhoto = function() {

    const file =
        document.getElementById(
            "postPhoto"
        ).files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {

        alert(
            "Please choose an image."
        );

        return;

    }

    selectedPostFile =
        file;

    const reader =
        new FileReader();

    reader.onload =
        function(event) {

            document.getElementById(
                "postPreviewImage"
            ).src =
                event.target.result;

            document.getElementById(
                "postPhotoPreview"
            ).style.display =
                "block";

        };

    reader.readAsDataURL(file);

};


window.removePostPhoto = function() {

    selectedPostFile =
        null;

    document.getElementById(
        "postPhoto"
    ).value =
        "";

    document.getElementById(
        "postPhotoPreview"
    ).style.display =
        "none";

};


/* =====================================================
   CREATE POST
===================================================== */

window.createPost = async function() {

    if (!currentUsername) {

        alert(
            "Please enter your username first."
        );

        return;

    }

    const input =
        document.getElementById(
            "postInput"
        );

    const text =
        input.value.trim();

    if (!text && !selectedPostFile) {

        alert(
            "Write something or add a photo."
        );

        return;

    }

    try {

        postButton.disabled =
            true;

        postButton.textContent =
            "Posting...";

        let imageUrl =
            "";

        /* UPLOAD PHOTO */

        if (selectedPostFile) {

            const safeName =
                selectedPostFile.name
                    .replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );

            const filePath =
                `posts/${Date.now()}_${safeName}`;

            const imageRef =
                storageRef(
                    storage,
                    filePath
                );

            await uploadBytes(
                imageRef,
                selectedPostFile
            );

            imageUrl =
                await getDownloadURL(
                    imageRef
                );

        }


        /* CREATE DATABASE POST */

        const newPostRef =
            push(
                postsRef
            );

        await set(
            newPostRef,
            {

                username:
                    currentUsername,

                text:
                    text,

                image:
                    imageUrl,

                timestamp:
                    Date.now(),

                likes:
                    0,

                reposts:
                    0

            }
        );


        /* RESET */

        input.value =
            "";

        removePostPhoto();

    }

    catch(error) {

        console.error(error);

        alert(
            "Something went wrong while posting.\n\n" +
            error.message
        );

    }

    finally {

        postButton.disabled =
            false;

        postButton.textContent =
            "Post";

    }

};


/* =====================================================
   RENDER POSTS
===================================================== */

function renderPosts() {

    feed.innerHTML =
        "";

    const postEntries =
        Object.entries(posts);

    if (
        postEntries.length === 0
    ) {

        feed.innerHTML = `
            <div class="empty">
                No posts yet.<br>
                Be the first to post.
            </div>
        `;

        return;

    }


    /* NEWEST FIRST */

    postEntries.sort(
        (a, b) =>
            (b[1].timestamp || 0)
            -
            (a[1].timestamp || 0)
    );


    postEntries.forEach(
        ([postId, post]) => {

            const postElement =
                document.createElement(
                    "div"
                );

            postElement.className =
                "post";

            const username =
                post.username ||
                "Unknown";

            const initials =
                getInitials(username);

            const likes =
                Number(post.likes || 0);

            const reposts =
                Number(post.reposts || 0);


            postElement.innerHTML = `

                <div class="post-header">

                    <div class="avatar">
                        ${escapeHTML(initials)}
                    </div>

                    <div>

                        <span class="name">
                            ${escapeHTML(username)}
                        </span>

                        <span class="username">
                            @${escapeHTML(username)}
                        </span>

                        <span class="post-time">
                            ${formatTime(post.timestamp)}
                        </span>

                    </div>

                    ${
    			post.username === currentUsername
    			?
    			`
 		        <button
        		    class="delete-button"
                            onclick="deletePost('${postId}')"
                        >
                            Delete
                        </button>
    			`
    			:
    			""
	            }

                </div>


                ${
                    post.text
                    ?
                    `
                    <div class="post-text">
                        ${escapeHTML(post.text)}
                    </div>
                    `
                    :
                    ""
                }


                ${
                    post.image
                    ?
                    `
                    <img
                        class="post-image"
                        src="${escapeHTML(post.image)}"
                        alt="Post image"
                    >
                    `
                    :
                    ""
                }


                <div class="actions">

                    <button
                        class="action-btn"
                        onclick="toggleComment('${postId}')"
                    >
                        💬
                        <span id="comment-count-${postId}">
                            0
                        </span>
                    </button>


                    <button
                        class="action-btn"
                        id="repost-${postId}"
                        onclick="toggleRepost('${postId}')"
                    >
                        🔁 ${reposts}
                    </button>


                    <button
                        class="action-btn"
                        id="like-${postId}"
                        onclick="toggleLike('${postId}')"
                    >
                        ❤️ ${likes}
                    </button>

                </div>


                <div
                    class="comments"
                    id="comments-${postId}"
                >

                    <div
                        id="comment-list-${postId}"
                    >
                        Loading replies...
                    </div>


                    <div class="comment-form">

                        <textarea
                            id="comment-input-${postId}"
                            placeholder="Reply to this post..."
                            maxlength="300"
                        ></textarea>


                        <div class="comment-bottom">

                            <label class="photo-label">

                                📷

                                <input
                                    type="file"
                                    id="reply-photo-${postId}"
                                    accept="image/*"
                                    onchange="selectReplyPhoto('${postId}')"
                                >

                            </label>


                            <button
                                class="reply-button"
                                onclick="addComment('${postId}')"
                            >
                                Reply
                            </button>

                        </div>

                    </div>

                </div>

            `;


            feed.appendChild(
                postElement
            );


            loadComments(
                postId
            );

        }
    );

}


/* =====================================================
   LIKE
===================================================== */

window.toggleLike = async function(
    postId
) {

    if (!currentUsername) {

        alert(
            "Set your username first."
        );

        return;

    }

    const post =
        posts[postId];

    if (!post) return;


    const likeKey =
        btoa(
            currentUsername
        )
        .replace(
            /[^a-zA-Z0-9]/g,
            ""
        );


    const likeRef =
        ref(
            database,
            `posts/${postId}/likedBy/${likeKey}`
        );


    const likeSnapshot =
        await new Promise(
            resolve => {

                onValue(
                    likeRef,
                    resolve,
                    {
                        onlyOnce: true
                    }
                );

            }
        );


    const currentlyLiked =
        likeSnapshot.exists();


    if (currentlyLiked) {

        await remove(
            likeRef
        );

        await update(
            ref(
                database,
                `posts/${postId}`
            ),
            {
                likes:
                    Math.max(
                        0,
                        Number(post.likes || 0) - 1
                    )
            }
        );

    } else {

        await set(
            likeRef,
            true
        );

        await update(
            ref(
                database,
                `posts/${postId}`
            ),
            {
                likes:
                    Number(post.likes || 0) + 1
            }
        );

    }

};


/* =====================================================
   REPOST
===================================================== */

window.toggleRepost = async function(
    postId
) {

    if (!currentUsername) {

        alert(
            "Set your username first."
        );

        return;

    }

    const post =
        posts[postId];

    if (!post) return;


    const repostKey =
        btoa(
            currentUsername
        )
        .replace(
            /[^a-zA-Z0-9]/g,
            ""
        );


    const repostRef =
        ref(
            database,
            `posts/${postId}/repostedBy/${repostKey}`
        );


    const snapshot =
        await new Promise(
            resolve => {

                onValue(
                    repostRef,
                    resolve,
                    {
                        onlyOnce: true
                    }
                );

            }
        );


    const currentlyReposted =
        snapshot.exists();


    if (currentlyReposted) {

        await remove(
            repostRef
        );

        await update(
            ref(
                database,
                `posts/${postId}`
            ),
            {
                reposts:
                    Math.max(
                        0,
                        Number(post.reposts || 0) - 1
                    )
            }
        );

    } else {

        await set(
            repostRef,
            true
        );

        await update(
            ref(
                database,
                `posts/${postId}`
            ),
            {
                reposts:
                    Number(post.reposts || 0) + 1
            }
        );

    }

};


/* =====================================================
   COMMENTS
===================================================== */

window.toggleComment = function(
    postId
) {

    const box =
        document.getElementById(
            `comments-${postId}`
        );

    if (!box) return;

    if (
        box.style.display ===
        "block"
    ) {

        box.style.display =
            "none";

    } else {

        box.style.display =
            "block";

    }

};


window.selectReplyPhoto = function(
    postId
) {

    const input =
        document.getElementById(
            `reply-photo-${postId}`
        );

    if (
        input &&
        input.files[0]
    ) {

        selectedReplyFiles[postId] =
            input.files[0];

    }

};


window.addComment = async function(
    postId
) {

    if (!currentUsername) {

        alert(
            "Set your username first."
        );

        return;

    }


    const input =
        document.getElementById(
            `comment-input-${postId}`
        );

    const text =
        input.value.trim();

    const file =
        selectedReplyFiles[postId];


    if (!text && !file) {

        alert(
            "Write a reply or add a photo."
        );

        return;

    }


    try {

        let imageUrl =
            "";


        /* UPLOAD REPLY PHOTO */

        if (file) {

            const safeName =
                file.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );

            const filePath =
                `comments/${Date.now()}_${safeName}`;

            const imageRef =
                storageRef(
                    storage,
                    filePath
                );

            await uploadBytes(
                imageRef,
                file
            );

            imageUrl =
                await getDownloadURL(
                    imageRef
                );

        }


        const commentsRef =
            ref(
                database,
                `posts/${postId}/comments`
            );


        const newCommentRef =
            push(
                commentsRef
            );


        await set(
            newCommentRef,
            {

                username:
                    currentUsername,

                text:
                    text,

                image:
                    imageUrl,

                timestamp:
                    Date.now()

            }
        );


        input.value =
            "";

        document.getElementById(
            `reply-photo-${postId}`
        ).value =
            "";

        delete selectedReplyFiles[
            postId
        ];


        document.getElementById(
            `comments-${postId}`
        ).style.display =
            "block";

    }

    catch(error) {

        console.error(error);

        alert(
            "Could not send reply.\n\n" +
            error.message
        );

    }

};


/* =====================================================
   LOAD COMMENTS
===================================================== */

function loadComments(
    postId
) {

    const commentsRef =
        ref(
            database,
            `posts/${postId}/comments`
        );


    onValue(
        commentsRef,
        snapshot => {

            const comments =
                snapshot.val() || {};

            const entries =
                Object.entries(
                    comments
                );


            const list =
                document.getElementById(
                    `comment-list-${postId}`
                );

            const count =
                document.getElementById(
                    `comment-count-${postId}`
                );


            if (!list) return;


            if (count) {

                count.textContent =
                    entries.length;

            }


            if (
                entries.length === 0
            ) {

                list.innerHTML = `
                    <div style="
                        color:#888;
                        font-size:13px;
                        padding:8px 0;
                    ">
                        No replies yet.
                    </div>
                `;

                return;

            }


            entries.sort(
                (a,b) =>
                    (a[1].timestamp || 0)
                    -
                    (b[1].timestamp || 0)
            );


            list.innerHTML =
                entries.map(
                    ([commentId, comment]) => {

                        return `

                            <div class="comment">

                                <div class="comment-header">

                                    <div class="comment-avatar">
                                        ${escapeHTML(
                                            getInitials(
                                                comment.username || "?"
                                            )
                                        )}
                                    </div>

                                    <div>

                                        <strong>
                                            ${escapeHTML(
                                                comment.username || "Unknown"
                                            )}
                                        </strong>

                                        <span class="username">
                                            @${escapeHTML(
                                                comment.username || "unknown"
                                            )}
                                        </span>

                                    </div>

                                </div>


                                ${
                                    comment.text
                                    ?
                                    `
                                    <div class="comment-text">
                                        ${escapeHTML(
                                            comment.text
                                        )}
                                    </div>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    comment.image
                                    ?
                                    `
                                    <img
                                        class="comment-image"
                                        src="${escapeHTML(
                                            comment.image
                                        )}"
                                        alt="Reply image"
                                    >
                                    `
                                    :
                                    ""
                                }

                            </div>

                        `;

                    }
                ).join("");

        }
    );

}


/* =====================================================
   DELETE POST - OWNER ONLY
===================================================== */

window.deletePost = async function(postId) {

    const post = posts[postId];

    if (!post) return;

    // Make sure a username is set
    if (!currentUsername) {
        alert("Please set your username first.");
        return;
    }

    // ONLY the person who created the post can delete it
    if (post.username !== currentUsername) {
        alert("You can only delete your own post.");
        return;
    }

    const confirmed = confirm(
        "Delete your post permanently?"
    );

    if (!confirmed) return;

    try {

        await remove(
            ref(
                database,
                `posts/${postId}`
            )
        );

    }

    catch(error) {

        console.error(error);

        alert(
            "Could not delete the post."
        );

    }

};

/* =====================================================
   UTILITIES
===================================================== */

function getInitials(
    name
) {

    const parts =
        String(name)
            .trim()
            .split(/\s+/);


    if (
        parts.length === 1
    ) {

        return parts[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();

}


function formatTime(
    timestamp
) {

    if (!timestamp) {
        return "";
    }

    const date =
        new Date(timestamp);


    return date.toLocaleString(
        undefined,
        {
            month: "short",
            day: "numeric",
            year: "numeric",
            hour: "numeric",
            minute: "2-digit"
        }
    );

}


function escapeHTML(
    text
) {

    return String(text || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
